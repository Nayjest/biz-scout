services:
  ollama:
    image: ollama/ollama:latest
    environment:
      # Quiet the per-request [GIN] HTTP access logs (and the startup warning);
      # model load/error logs are unaffected.
      - GIN_MODE=release
      # Keep models resident in memory instead of evicting after idle (default 5m),
      # and allow the chat LLM + embedding model to stay loaded at the same time.
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
    volumes:
      - ./storage/ollama-models:/root/.ollama  # persist pulled models across restarts
    ports:
      - "11434:11434"  # optional: expose for host-side `ollama`/curl debugging
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    # NVIDIA GPU passthrough (requires the NVIDIA Container Toolkit on the host).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      # Default chat LLM: gemma4:12b (~7.6GB). Was gemma3n:e4b / qwen3.5:0.8b.
      - >
        ollama pull ${OLLAMA_MODEL:-gemma4:12b} &&
        ollama pull ${EMBEDDING_MODEL:-paraphrase-multilingual}
    restart: "no"

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LLM_API_TYPE=openai
      - LLM_API_BASE=http://ollama:11434/v1
      - LLM_API_KEY=ollama
      # Default chat LLM: gemma4:12b (~7.6GB). Was gemma3n:e4b / qwen3.5:0.8b.
      - MODEL=${OLLAMA_MODEL:-gemma4:12b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-paraphrase-multilingual}
    depends_on:
      model-pull:
        condition: service_completed_successfully
    volumes:
      - ./biz_scout:/app/biz_scout
      - ./tpl:/app/tpl  # live-edit Jinja2 prompt templates without a rebuild
    restart: unless-stopped
