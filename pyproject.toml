[project]
name = "biz-scout"
version = "0.1.0"
description = "A tool that builds a local, queryable knowledge base about a target company from public sources, then answers questions about it offline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "ai-microcore>=4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_scout"]
